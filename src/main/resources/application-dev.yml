spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/gymtracker
  datasource:
    url: jdbc:postgresql://localhost:5432/gymdb
    username: myuser
    password: secret
  jpa:
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    oauth:
      client-id: gym-api
      use-pkce-with-authorization-code-grant: true
  api-docs:
    path: /v3/api-docs

gymtracker:
  ai:
    enabled: false
    api-key: ${ANTHROPIC_API_KEY:}